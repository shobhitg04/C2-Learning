server:
  port: 8088
spring:
  config:
    import: optional:file:./datasource-local.yml,optional:file:./backend/datasource-local.yml
  datasource:
    url: jdbc:postgresql://localhost:5434/tickets
    username: ${DB_USER:tickets}
    password: ${LOCAL_DB_PASSWORD:${DB_PASSWORD:}}
  sql:
    init:
      mode: always
  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.1
          temperature: 0
app:
  ollama:
    url: ${OLLAMA_URL:http://localhost:11434}
  rag:
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.6}

ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.1
          temperature: 0
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        distance-type: COSINE_DISTANCE

