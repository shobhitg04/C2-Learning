spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tickets
    username: ${DB_USER:tickets}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
app:
  ollama:
    url: ${OLLAMA_URL:http://localhost:11434}
  rag:
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.6}

ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.1
          temperature: 0
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        distance-type: COSINE_DISTANCE

